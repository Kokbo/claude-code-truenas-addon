# Paste into TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML
# Replace "StoragePool" with your pool name and fill in every CHANGE-ME.
services:
  claude-code:
    image: ghcr.io/kokbo/claude-code-truenas:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    # Host networking lets the app reach the TrueNAS API on "localhost",
    # which matches the default TrueNAS certificate, so TLS is fully verified.
    network_mode: host
    environment:
      TZ: Europe/Amsterdam

      # Web terminal login (http://<nas-ip>:7681)
      TTYD_USER: claude
      TTYD_PASSWORD: "CHANGE-ME"

      # TrueNAS API access with the read-only claude-ro user.
      # Use the Web Interface HTTPS Port from System > General > GUI:
      #   443 → localhost        anything else → localhost:<port>, e.g. localhost:444
      TRUENAS_URL: "localhost:444"
      TRUENAS_API_USER: claude-ro
      TRUENAS_API_KEY: "CHANGE-ME"
      TRUENAS_MCP_READ_ONLY: "true"
      # Only if the web UI is bound to one IP instead of 0.0.0.0:
      # set TRUENAS_URL to that IP (with the port) and uncomment this.
      # TRUENAS_INSECURE: "true"

      # Remote Control: steer sessions from claude.ai/code or the Claude app
      ENABLE_REMOTE_CONTROL: "true"
      REMOTE_CONTROL_NAME: TrueNAS
      # REMOTE_CONTROL_PERMISSION_MODE: plan   # default, acceptEdits or plan

      # Optional
      # CLAUDE_MODEL: claude-opus-5-5
      # TERMINAL_THEME: dark            # or light
      # TERMINAL_FONT_SIZE: "14"
      # AUTO_UPDATE_CLAUDE: "true"
      # TTYD_PORT: "7681"
    volumes:
      # App state: Claude login, settings, MCP config, history.
      # Its own dataset without an SMB share: it holds your login and API key.
      - /mnt/StoragePool/apps/claude-code:/data
      # Optional: read-only view of your data, so Claude can inspect files
      # - /mnt/StoragePool/media:/mnt/StoragePool/media:ro
