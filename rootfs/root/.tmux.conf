set -g history-limit 20000
# Use the primary screen so xterm.js owns the scrollback buffer
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
# Mouse off: the browser handles scrolling and copy/paste (works on touch devices too)
set -g mouse off
# Start login shells so ~/.bashrc is loaded in every window
set -g default-command "bash --login"
